name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --release --all-targets --target ${{ matrix.target }} -- -D warnings

      # Two executables per architecture, differing only in the default name of
      # the WSL2 VM process: vmmemWSL on Windows 11, vmmem on Windows 10 (the
      # `win10` feature). Both builds write the same file, so each one is copied
      # to dist/ under its release name before the next one runs.
      - name: Build (Windows 11)
        shell: bash
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/wsltray.exe dist/wsltray-win11-${{ matrix.arch }}.exe

      - name: Build (Windows 10)
        shell: bash
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --features win10
          cp target/${{ matrix.target }}/release/wsltray.exe dist/wsltray-win10-${{ matrix.arch }}.exe

      - name: Test
        if: matrix.arch == 'x64'
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Docs
        if: matrix.arch == 'x64'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items --target ${{ matrix.target }}

      - name: Report size
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object { "$($_.Name): $($_.Length) bytes" } | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: wsltray-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum wsltray-win11-x64.exe wsltray-win11-arm64.exe \
                    wsltray-win10-x64.exe wsltray-win10-arm64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          | Download | AMD64 | ARM64 |
          |---|---|---|
          | Windows 11 (VM process `vmmemWSL`) | `wsltray-win11-x64.exe` | `wsltray-win11-arm64.exe` |
          | Windows 10 (VM process `vmmem`) | `wsltray-win10-x64.exe` | `wsltray-win10-arm64.exe` |

          The two variants differ only in the default of `-process`. If the icon stays grey while WSL2 is running, check the process name in Task Manager and take the other one.

          MD
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "wsltray $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            dist/wsltray-win11-x64.exe dist/wsltray-win11-arm64.exe \
            dist/wsltray-win10-x64.exe dist/wsltray-win10-arm64.exe \
            dist/SHA256SUMS
